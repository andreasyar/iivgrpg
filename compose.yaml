name: iivgrpg
services:
  client:
    build:
      context: .
      dockerfile: dev/client/Dockerfile
    init: true
    working_dir: /workspace/client
    command: sh -c 'npm ci --no-audit --no-fund && exec npm run dev'
    ports:
      - '127.0.0.1:${CLIENT_PORT:-5174}:5173'
    volumes:
      - .:/workspace:rw,z
      - client_modules:/workspace/client/node_modules
      - client_dist:/workspace/client/dist
      - npm_cache:/root/.npm
  server:
    build:
      context: .
      dockerfile: dev/server/Dockerfile
    init: true
    working_dir: /workspace/server
    command: python3 /workspace/dev/server/watch.py
    environment:
      MAVEN_ARGS: -Diivgrpg.buildDirectory=/build/server/target
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SERVER_PORT:-8016}:8015'
    volumes:
      - .:/workspace:ro,z
      - server_target:/build/server
      - maven_cache:/root/.m2
      - server_run:/run/iivgrpg
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: iivgrpg
      MARIADB_USER: iivgrpg
      MARIADB_PASSWORD: iivgrpg-dev
      MARIADB_ROOT_PASSWORD: iivgrpg-root-dev
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - database:/var/lib/mysql
volumes:
  client_modules:
  client_dist:
  npm_cache:
  server_target:
  maven_cache:
  server_run:
  database:
