name: iivgrpg
services:
  client:
    build:
      context: .
      dockerfile: dev/client/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
      HOME: /home/developer
    init: true
    working_dir: /workspace/client
    command: sh -c 'npm ci --no-audit --no-fund && exec npm run dev'
    ports:
      - '127.0.0.1:${CLIENT_PORT:-5174}:5173'
    volumes:
      - .:/workspace:rw,z
      - client_modules:/workspace/client/node_modules
      - client_dist:/workspace/client/dist
      - npm_cache:/home/developer/.npm
  server:
    build:
      context: .
      dockerfile: dev/server/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    init: true
    working_dir: /workspace/server
    command: python3 /workspace/dev/server/watch.py
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
      HOME: /home/developer
      MAVEN_CONFIG: /home/developer/.m2
      MAVEN_ARGS: -Duser.home=/home/developer -Diivgrpg.buildDirectory=/build/server/target
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SERVER_PORT:-8016}:8015'
    volumes:
      - .:/workspace:ro,z
      - server_target:/build/server
      - maven_cache:/home/developer/.m2
      - server_run:/run/iivgrpg
  db:
    image: mariadb:11.4
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    tmpfs:
      - /run/mysqld:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=0755
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
      MARIADB_DATABASE: iivgrpg
      MARIADB_USER: iivgrpg
      MARIADB_PASSWORD: iivgrpg-dev
      MARIADB_ROOT_PASSWORD: iivgrpg-root-dev
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - type: volume
        source: database
        target: /var/lib/mysql
        volume:
          nocopy: true
volumes:
  client_modules:
  client_dist:
  npm_cache:
  server_target:
  maven_cache:
  server_run:
  database:
