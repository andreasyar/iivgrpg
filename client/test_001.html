    x: SCR_W / 2,   // x-axis of player on screen. For salf player always screen width / 2.

        player: {
            image: new Image(),

    // Returns sprite by its key in playerSprites array.
    getPlayerSprite: function(key) {
        return this.playerSprites[key].image;
    },
    speed: 3,           // Movement speed in cells per second.
    is_move: false,     // Flag, is player move.
    move_to_j: null,    // j index of movement destination cell.
    move_to_i: null,    // i index of movement destination cell.
    
    // Draw function. Very simplw yet.
    draw: function() {
        var c = players_buffer.getContext('2d');

        var x = Map.getCellXOnScreen(this.j, this.x, this.j);
        var y = Map.getCellYOnScreen(this.i, this.y, this.i);
        c.drawImage(this.spriteLoader.getSprite('player', 'stand_s'), x, y);
        c.fillText(':3', x + 2, y + 10);
    },
    
    // Movement function. Very simple movement algorithm. This function calls
    // itself while destination not reached and then stops movement.
    move: function() {
        
        // Здесь нет ни каких проверок, игрок просто тупо движется в заданную точку и всё.
        
        if (this.move_to_j != null && this.move_to_i != null && (this.j != this.move_to_j || this.i != this.move_to_i)) {
            this.is_move = true;
            if (this.j < this.move_to_j) {
                this.j++;
            } else if (this.j > this.move_to_j) {
                this.j--;
            }
            if (this.i < this.move_to_i) {
                this.i++;
            } else if (this.i > this.move_to_i) {
                this.i--;
            }
            setTimeout('self_player.move();', 1000 / this.speed);
        } else {
            this.is_move = false;
            this.move_to_j = null;
            this.move_to_i = null;
            return;
        }
    }
};

// Server interaction object.
var server = {
    socket: null,
    messages: new Array(),
    connect: function(addr) {
        if (window.WebSocket) {
            this.socket = new WebSocket(addr);
            this.socket.onmessage = function(event) {
                //alert(event.data);
                document.getElementById('messages').innerHTML = event.data;
            };
            this.socket.onopen = function(event) {
                //alert("Web Socket opened!");
                for (var i = 0; i < server.messages.length; i++) {
                    server.sendMessage(server.messages[i]);
                }
                server.messages = new Array();
            };
            this.socket.onclose = function(event) {
                alert("Web Socket closed.");
            };
            return true;
        } else {
            alert("Your browser does not support Web Socket.");
            return false;
        }
    },
    sendMessage: function(object) {
        if (!window.WebSocket) {
            return false;
        }
        if (this.socket == null) {
            //alert("The socket is null.");
            this.messages.push(object);
            return false; 
        }
        if (this.socket.readyState == WebSocket.OPEN) {
            this.socket.send(JSON.stringify(object));
            return true; 
        } else {
            //alert("The socket is not open.");
            this.messages.push(object);
            return false; 
        }
    }
};

// Login message constructor.
function LoginMessage(login, password) {
    if (this.constructor !== arguments.callee) {
        throw new Error("Incorrect call - constructor called like a simple function!");
    }
    
    this.type = message_types.LOGIN;
    this.login = login;
    this.password = password;
    return this;
}

// http://stackoverflow.com/questions/2936112/text-wrap-in-a-canvas-element
// Разбивает фразу на отдельные слова и возвращает массив подфраз фразы phrase,
// влезающих в ширину maxPxLength при выводе на экран.
function getLines(ctx, phrase, maxPxLength, textFont) {
    var wa = phrase.split(" "),
        phraseArray = [],
        lastPhrase = "",
        l = maxPxLength,
        measure = 0;   // Length of word tail in percent.
    ctx.font = textFont;
    for (var i = 0; i < wa.length; i++) {
        var w = wa[i];
        measure = ctx.measureText(lastPhrase + w).width;
        if (measure < l) {
            lastPhrase += (w + " ");
        } else {
            phraseArray.push(lastPhrase);
            lastPhrase = w;
        }
        if (i === wa.length - 1) {
            phraseArray.push(lastPhrase);
            break;
        }
    }
    return phraseArray;
}

function main_loop() {
    var scr_context = scr.getContext('2d');

    // background
    scr_context.fillStyle = "#FFFFEE";
    scr_context.fillRect(0, 0, SCR_W, SCR_H);

    // Пока что будем очищать всю конву целиком, а не только область в которой
    // было что-то нарисовано.
    players_buffer.getContext('2d').clearRect(0, 0, players_buffer.width,
                                              players_buffer.height);
    map_buffer.getContext('2d').clearRect(0, 0, map_buffer.width,
                                          map_buffer.height);
    //gui_buffer.getContext('2d').clearRect(0, 0, gui_buffer.width,
    //                                      gui_buffer.height);

    map.draw(map_buffer.getContext('2d'));
    // draw stuff
    for (var i in drawable_objects) {
        drawable_objects[i].draw();
    }

    // draw map
    scr_context.drawImage(map_buffer, 0, 0);

    // draw players
    scr_context.drawImage(players_buffer, 0, 0);

    // Отрисовка буфера с гуи в главной конве. Сейчас не используется.
    //scr_context.drawImage(gui_buffer, 0, 0);

    setTimeout("main_loop();", 1000 / FPS);
}

// Обработчик щелчка мыли на конве. Передвигает игрока в клетку карты, в которой
// произошле щелчёк.
function scrOnClick(e) {
    var x;
    var y;
    if (e.pageX != undefined && e.pageY != undefined) {
        x = e.pageX;
        y = e.pageY;
    }
    else {
        x = e.clientX + document.body.scrollLeft
            + document.documentElement.scrollLeft;
        y = e.clientY + document.body.scrollTop
            + document.documentElement.scrollTop;
    }
    x -= scr.offsetLeft;
    y -= scr.offsetTop;

    // Код, оставшийся после тестирования своих элементов управления.
    /*for (var i in drawable_objects) {
        if (drawable_objects[i].contains != undefined) {
            if (drawable_objects[i].contains(x, y)) {
                drawable_objects[i].onPress(x, y);
            }
        }
    }*/

    // Calculate destination cell indexes and start movement.
    var j = Map.getCellJFromScreen(x, self_player.x, self_player.j);
    var i = Map.getCellIFromScreen(y, self_player.y, self_player.i);
    self_player.move_to_j = j;
    self_player.move_to_i = i;
    if (!self_player.is_move) {
        self_player.move();
    }
}
