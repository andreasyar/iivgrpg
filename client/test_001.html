<!DOCTYPE HTML>
<!-- Supermarket Software Foundation (c) -->
<html>
<head>
<title>Test</title>
<style type="text/css" >
#scr {
    border: 1px solid #000000;
}
#login_form {
    background-color: tan;
    z-index: 1;
    position: absolute;
    top: 300px;
    left: 300px;
    visibility: hidden;
}
</style>
<script type="text/javascript" src="Constants.js"></script>
<script type="text/javascript" src="routines.js"></script>
<script type="text/javascript" src="resources.js"></script>
<script type="text/javascript" src="IdGenerator.js"></script>
<script type="text/javascript" src="map.js"></script>
<script type="text/javascript" src="spriteLoader.js"></script>
<script type="text/javascript" src="Player.js"></script>
<script type="text/javascript" src="ServerInteraction.js"></script>
<script type="text/javascript" src="Messages.js"></script>
</head>
<body>
<script type="text/javascript">

/*********************
 * Создание холстов. *
 *********************/

// Основной холст, который будет показан клиенту.

var scr = document.createElement('canvas');
scr.id = "scr";
scr.width = SCR_W;
scr.height = SCR_H;
scr.addEventListener("click", scrOnClick, false);
var body = document.getElementsByTagName('body')[0];
body.appendChild(scr);

// Холст для рисования карты.

var map_buffer = document.createElement('canvas');
map_buffer.width = SCR_W;
map_buffer.height = SCR_H;

// Холст для рисования игроков.

var players_buffer = document.createElement('canvas');
players_buffer.width = SCR_W;
players_buffer.height = SCR_H;

/*************************
 * Служебные переменные. *
 *************************/

// Свой игрок.
var self_player;

// Карта.
var map;

// Сервер.
var server;

/************
 * Функции. *
 ************/

/**
 * Инициализация. Создание своего игрока, карты, подключение к серверу, и т.д.
 */
function init() {
    var lgn = document.getElementById('login_fild').value;
    var pass = document.getElementById('password_fild').value;
    var serv = document.getElementById('server_fild').value;

    self_player = new Player(SCR_W / 2, SCR_H / 2, 5, 5, lgn,
                             new SpriteLoader(SPRITES));
    map = new Map(100, 100, self_player, new SpriteLoader(SPRITES));
    server = new ServerInteraction();
    server.connect(serv);
    server.addMessage(new LoginMessage(lgn, pass));

    // Запускаем главный цикл.
    setTimeout("mainLoop();", 1000 / FPS);

    hideLoginForm();
    return false;
}

/**
 * Главный цикл игры.
 */
function mainLoop() {

    // Обработаем все сообщения полученные с сервера.
    server.processMessages();

    // Отправим на сервер сообщения, ожидающие отправки.
    server.sendMessages();

    var scr_context = scr.getContext('2d');

    // background
    scr_context.fillStyle = "#FFFFEE";
    scr_context.fillRect(0, 0, SCR_W, SCR_H);

    // Пока что будем очищать всю конву целиком, а не только область в которой
    // было что-то нарисовано.
    players_buffer.getContext('2d').clearRect(0, 0, players_buffer.width,
                                              players_buffer.height);
    map_buffer.getContext('2d').clearRect(0, 0, map_buffer.width,
                                          map_buffer.height);
    //gui_buffer.getContext('2d').clearRect(0, 0, gui_buffer.width,
    //                                      gui_buffer.height);

    map.draw(map_buffer.getContext('2d'));
    self_player.draw(players_buffer.getContext('2d'));

    // draw map
    scr_context.drawImage(map_buffer, 0, 0);

    // draw players
    scr_context.drawImage(players_buffer, 0, 0);

    // Отрисовка буфера с гуи в главной конве. Сейчас не используется.
    //scr_context.drawImage(gui_buffer, 0, 0);

    setTimeout("mainLoop();", 1000 / FPS);
}

/**
 * Обработчик щелчка мыли на главном холсте.
 */
function scrOnClick(e) {
    var x;
    var y;
    if (e.pageX != undefined && e.pageY != undefined) {
        x = e.pageX;
        y = e.pageY;
    }
    else {
        x = e.clientX + document.body.scrollLeft
            + document.documentElement.scrollLeft;
        y = e.clientY + document.body.scrollTop
            + document.documentElement.scrollTop;
    }
    x -= scr.offsetLeft;
    y -= scr.offsetTop;

    // Код, оставшийся после тестирования своих элементов управления.
    /*for (var i in drawable_objects) {
        if (drawable_objects[i].contains != undefined) {
            if (drawable_objects[i].contains(x, y)) {
                drawable_objects[i].onPress(x, y);
            }
        }
    }*/

    // Вычислим клетку в которой был щелчёк и переместим туда игрока с
    // случайной скоростью.
    var j = Map.getCellJFromScreen(x, self_player.x, self_player.j);
    var i = Map.getCellIFromScreen(y, self_player.y, self_player.i);
    if (!self_player.is_move) {
        self_player.speed = Math.floor(1 + Math.random() * 10); // 1-10
        self_player.move(j, i);
    }
}

</script>

<!-- Форма логина. -->
<div id="login_form">
Login: <input type="text" id="login_fild"><br>
Password: <input type="text" id="password_fild"><br>
Server: <input type="server_fild" id="server_fild"
               value="ws://localhost:8015/ws"><br>
<input type="button" id="login_button" value="Login"
       onclick="init(); return false;">
</div>

<script type="text/javascript">
    showLoginForm();
</script>
</body>
</html>
