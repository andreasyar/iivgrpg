<!DOCTYPE HTML>
<!-- Supermarket Software Foundation (c) -->
<html>
<head>
<title>Test</title>
<style>
#scr {
    border: 1px solid #000000;  /* Border around main canvas. */
}
</style>
</head>
<body onLoad="init()"><!-- main_loop() -->
<script>

/*************
 * Constants *
 *************/

var SCR_W = 800;
var SCR_H = 600;
var FPS = 50;

////////////////////////////////////////////////////
// Do not edit code below if you not a programer. //
////////////////////////////////////////////////////

/*****************
 * Create canvas *
 *****************/

// Main drawing canvas.

var scr = document.createElement('canvas');
scr.id = "scr";
scr.width = SCR_W;
scr.height = SCR_H;
scr.addEventListener("click", scrOnClick, false);
var body = document.getElementsByTagName('body')[0];
body.appendChild(scr);

// Bufer for draw map.

var map_buffer = document.createElement('canvas');
map_buffer.width = SCR_W;
map_buffer.height = SCR_H;

// Bufer for draw players.

var players_buffer = document.createElement('canvas');
players_buffer.width = SCR_W;
players_buffer.height = SCR_H;

/*********************
 * Service variables *
 *********************/

var CELL_W = 30;        // Map cell width.
var CELL_HW = 30 / 2;
var CELL_H = 30;        // Map cell height.
var CELL_HH = 30 / 2;

// Array of objects what will be draw in main loop.
var drawable_objects = new Array();

// Map. Pathetic shit :)
var map = {
    w: 100, // Map width in cells.
    h: 100, // Map height in cells.
    
    // Associative array of sprites. One grass sprite yet.
    terrainSprites: {
        grass: {
            image: new Image(),
            src: 'grass.png'
        }
    },
    
    // Returns sprite by its key in terrainSprites array.
    getTerrainSprite: function(key) {
        return this.terrainSprites[key].image;
    },
    
    // Draw function. Draws map.
    draw: function() {
        var c = map_buffer.getContext('2d');
        
        // Clean all rect yet.
        c.clearRect(0, 0, map_buffer.width, map_buffer.height);

        // Вычислим, какие клетки карты помещаются на экран при текущем
        // положении нашего игрока. Например если наш игрок находится в клетке
        // 1, 1 то нам нужно нарисовать все клетки которые помещаются на экран
        // с клеткой 1, 1 в центре экрана.
        
        // j_from - индекс самой левой клетки, которая умещается на экран.
        var j_from = self_player.j - Math.ceil((self_player.x - CELL_HW) / CELL_W);
        if (j_from < 0) {
            j_from = 0;
        }
        
        // j_to  - индекс самой правой клетки, которая умещается на экран.
        var j_to = self_player.j + Math.ceil((self_player.x + CELL_HW) / CELL_W);
        if (j_to >= map.w) {
            j_to = map.w - 1;
        }
        
        // i_from - индекс самой верхней клетки, которая умещается на экран.
        var i_from = self_player.i - Math.ceil((self_player.y - CELL_HH) / CELL_H);
        if (i_from < 0) {
            i_from = 0;
        }
        
        // i_to - индекс самой нижней клетки, которая умещается на экран.
        var i_to = self_player.i + Math.ceil((self_player.y + CELL_HH) / CELL_H);
        if (i_to >= map.h) {
            i_to = map.h - 1;
        }

        // Draw calculated region of map cells.
        var x, y;
        for (var i = i_from; i < i_to; i++) {
            for (var j = j_from; j < j_to; j++) {
                x = this.getCellXOnScreen(j);
                y = this.getCellYOnScreen(i);
                c.drawImage(this.getTerrainSprite('grass'), x, y);
                
                // Also draw indexes of cell.
                //c.fillText(j + ',' + i, x + 2, y + 10);
            }
        }
    },
    
    // Возвращает x-координату экрана верхнего левого угла клетки карты по её индексу j.
    getCellXOnScreen: function(j) {
        return (self_player.x - CELL_HW) + (j - self_player.j) * CELL_W;
    },
    
    // Возвращает y-координату экрана верхнего левого угла клетки карты по её индексу i.
    getCellYOnScreen: function(i) {
        return (self_player.y - CELL_HH) + (i - self_player.i) * CELL_H;
    },
    
    // Возвращает j индекс клетки карты, которая находится в точке экрана с координатой x.
    getCellJFromScreen: function(x) {
        var _;
        if (x < self_player.x) {
            _ = self_player.j - Math.abs(Math.ceil((self_player.x - CELL_HW - x) / CELL_W));
        } else if (x > self_player.x) {
            _ = self_player.j + Math.abs(Math.ceil((x - (self_player.x + CELL_HW)) / CELL_W));
        } else {
            _ = self_player.j;
        }
        return _;
    },
    
    // Возвращает i индекс клетки карты, которая находится в точке экрана с координатой y.
    getCellIFromScreen: function(y) {
        var _;
        if (y < self_player.y) {
            _ = self_player.i - Math.abs(Math.ceil((self_player.y - CELL_HH - y) / CELL_H));
        } else if (y > self_player.y) {
            _ = self_player.i + Math.abs(Math.ceil((y - (self_player.y + CELL_HH)) / CELL_H));
        } else {
            _ = self_player.i;
        }
        return _;
    }
};

// Self player. Lol pathetic object too.
var self_player = {
    x: SCR_W / 2,   // x-axis of player on screen. For salf player always screen width / 2.
    y: SCR_H / 2,   // y-axis of player on screen. For salf player always screen height / 2.
    j: 5,           // j index of map cell where player stand at the moment.
    i: 5,           // i index of map cell where player stand at the moment.
    
    // Associative array of sprites. One player sprite yet.
    playerSprites: {
        player: {
            image: new Image(),
            src: 'player.png'
        }
    },
    
    // Returns sprite by its key in playerSprites array.
    getPlayerSprite: function(key) {
        return this.playerSprites[key].image;
    },
    speed: 3,           // Movement speed in cells per second.
    is_move: false,     // Flag, is player move.
    move_to_j: null,    // j index of movement destination cell.
    move_to_i: null,    // i index of movement destination cell.
    
    // Draw function. Very simplw yet.
    draw: function() {
        var c = players_buffer.getContext('2d');
        
        // Clean all rect yet.
        c.clearRect(0, 0, map_buffer.width, map_buffer.height);

        var x = map.getCellXOnScreen(this.j);
        var y = map.getCellYOnScreen(this.i);
        c.drawImage(this.getPlayerSprite('player'), x, y);
        c.fillText(':3', x + 2, y + 10);
    },
    
    // Movement function. Very simple movement algorithm. This function calls
    // itself while destination not reached and then stops movement.
    move: function() {
        
        // Здесь нет ни каких проверок, игрок просто тупо движется в заданную точку и всё.
        
        if (this.move_to_j != null && this.move_to_i != null && (this.j != this.move_to_j || this.i != this.move_to_i)) {
            this.is_move = true;
            if (this.j < this.move_to_j) {
                this.j++;
            } else if (this.j > this.move_to_j) {
                this.j--;
            }
            if (this.i < this.move_to_i) {
                this.i++;
            } else if (this.i > this.move_to_i) {
                this.i--;
            }
            setTimeout('self_player.move();', 1000 / this.speed);
        } else {
            this.is_move = false;
            this.move_to_j = null;
            this.move_to_i = null;
            return;
        }
    }

};

// Server interaction object.
var server = {
    socket: null,
    messages: new Array(),
    connect: function(addr) {
        if (window.WebSocket) {
            this.socket = new WebSocket(addr);
            this.socket.onmessage = function(event) {
                //alert(event.data);
                document.getElementById('messages').innerHTML = event.data;
            };
            this.socket.onopen = function(event) {
                //alert("Web Socket opened!");
                for (var i = 0; i < server.messages.length; i++) {
                    server.sendMessage(server.messages[i]);
                }
                server.messages = new Array();
            };
            this.socket.onclose = function(event) {
                alert("Web Socket closed.");
            };
            return true;
        } else {
            alert("Your browser does not support Web Socket.");
            return false;
        }
    },
    sendMessage: function(object) {
        if (!window.WebSocket) {
            return false;
        }
        if (this.socket == null) {
            //alert("The socket is null.");
            this.messages.push(object);
            return false; 
        }
        if (this.socket.readyState == WebSocket.OPEN) {
            this.socket.send(JSON.stringify(object));
            return true; 
        } else {
            //alert("The socket is not open.");
            this.messages.push(object);
            return false; 
        }
    }
};

// Message types enum.
var message_types = {
    LOGIN: "LOGIN"
};

// Login message constructor.
function LoginMessage(login, password) {
    if (this.constructor !== arguments.callee) {
        throw new Error("Incorrect call - constructor called like a simple function!");
    }
    
    this.type = message_types.LOGIN;
    this.login = login;
    this.password = password;
    return this;
}

// Load terrain sprites

for (var i in map.terrainSprites) {
    map.terrainSprites[i].image.src = map.terrainSprites[i].src;
}

// Load player sprites

for (var i in self_player.playerSprites) {
    self_player.playerSprites[i].image.src = self_player.playerSprites[i].src;
}

// Put objects into drawable list

drawable_objects.push(map);
drawable_objects.push(self_player);

/*************
 * Functions *
 *************/

function init() {
    server.sendMessage(new LoginMessage("sorc", "123"));
    //createLoginMessage(message_types.LOGIN, "sorc", "123");
    if (server.connect("ws://rz-public.no-ip.org:8015/websocket")) {
        setTimeout("main_loop();", 1000 / FPS);
    }
}

function main_loop() {
    var scr_context = scr.getContext('2d');

    // background
    scr_context.fillStyle = "#FFFFEE";
    scr_context.fillRect(0, 0, SCR_W, SCR_H);

    // draw stuff
    for (var i in drawable_objects) {
        drawable_objects[i].draw();
    }

    // draw map
    scr_context.drawImage(map_buffer, 0, 0);

    // draw players
    scr_context.drawImage(players_buffer, 0, 0);

    setTimeout("main_loop();", 1000 / FPS);
}

// Click handler. Cause player to move.
function scrOnClick(e) {
    var x;
    var y;
    if (e.pageX != undefined && e.pageY != undefined) {
        x = e.pageX;
        y = e.pageY;
    }
    else {
        x = e.clientX + document.body.scrollLeft + document.documentElement.scrollLeft;
        y = e.clientY + document.body.scrollTop + document.documentElement.scrollTop;
    }
    x -= scr.offsetLeft;
    y -= scr.offsetTop;
    
    // Calculate destination cell indexes and start movement.
    var j = map.getCellJFromScreen(x);
    var i = map.getCellIFromScreen(y);
    self_player.move_to_j = j;
    self_player.move_to_i = i;
    if (!self_player.is_move) {
        self_player.move();
    }
}
</script>
<div id="messages"></div>
</body>
</html>
